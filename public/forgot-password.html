<!doctype html>
<!-- AB#988 (ISP-281): ask for a link to reset a forgotten password. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISP: Forgot Your Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="scripts/starfield.js"></script>
    <script type="module" src="scripts/sectionCodesPage.js"></script>
    <script type="module" src="scripts/forgot-password-page.js"></script>
  </head>
  <body>
    <canvas id="starfield-canvas" aria-hidden="true"></canvas>
    <div class="app-bg" aria-hidden="true"></div>

    <main class="auth-page">
      <section class="ui-panel auth-page__card" aria-labelledby="forgot-title">
        <p class="auth-page__overline">Earth Assembly Act 2147</p>
        <h1 id="forgot-title" class="auth-page__title"><span class="ui-code" data-code-for="forgot-password" aria-hidden="true"></span>Forgot your password?</h1>
        <p class="auth-page__lede">
          Enter the email address you registered with. If it has an account, we will send it a link to choose a new
          password. The link works once, for one hour.
        </p>

        <form id="forgot-form" class="auth-page__form" novalidate>
          <div class="ui-field">
            <label class="ui-field__label" for="forgot-email">Email</label>
            <input class="ui-input" id="forgot-email" name="email" type="email" autocomplete="email" required placeholder="ceo@corporation.com" />
          </div>

          <p id="forgot-status" class="auth-page__status" aria-live="polite"></p>

          <div class="auth-page__actions">
            <button id="forgot-btn" class="ui-button ui-button--primary" type="submit">Send A Reset Link</button>
            <a href="/login.html" class="ui-button ui-button--secondary">Back To Log In</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
