<!doctype html>
<!-- AB#988 (ISP-281): ask for a link to reset a forgotten password. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISP: Forgot Your Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="scripts/starfield.js"></script>
    <script type="module" src="scripts/forgot-password-page.js"></script>
  </head>
  <body>
    <canvas id="starfield-canvas" aria-hidden="true"></canvas>
    <div class="app-bg" aria-hidden="true"></div>

    <main class="auth-shell login-shell">
      <section class="login-card" aria-labelledby="forgot-title">
        <p class="hero-overline">EARTH ASSEMBLY ACT 2147</p>
        <h1 id="forgot-title" class="login-title">Forgot your password?</h1>
        <p class="login-copy">
          Enter the email address you registered with. If it has an account, we will send it a link to choose a new
          password. The link works once, for one hour.
        </p>

        <form id="forgot-form" class="login-form" novalidate>
          <label for="forgot-email">Email</label>
          <input id="forgot-email" name="email" type="email" autocomplete="email" required placeholder="ceo@corporation.com" />

          <p id="forgot-status" class="login-status" aria-live="polite"></p>

          <div class="login-actions">
            <button id="forgot-btn" class="btn-hero btn-hero-fill" type="submit">Send A Reset Link</button>
            <a href="/login.html" class="btn-hero btn-hero-secondary">Back To Log In</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
