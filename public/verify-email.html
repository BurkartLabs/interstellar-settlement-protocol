<!doctype html>
<!-- AB#987 (ISP-280): the page a verification link opens. The token is in the fragment, which never reaches the
     server; the button posts it, so a mail scanner that fetches the link cannot spend it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- AB#954 (ISP-258): the favicon (so no load asks for a missing /favicon.ico) and the browser's colour. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#05070a" />
    <title>ISP: Verify Your Email</title>
    <link rel="preload" href="/vendor/inter-5.3.0/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script src="/scripts/displayStyles.js"></script>
    <script type="module" src="scripts/starfield.js"></script>
    <script type="module" src="scripts/sectionCodesPage.js"></script>
    <script type="module" src="scripts/verify-email-page.js"></script>
  </head>
  <body>
    <canvas id="starfield-canvas" aria-hidden="true"></canvas>
    <div class="app-bg" aria-hidden="true"></div>

    <main class="auth-page">
      <section class="ui-panel auth-page__card" aria-labelledby="verify-title">
        <p class="auth-page__overline">Earth Assembly Act 2147</p>
        <h1 class="auth-page__title"><span class="ui-code" data-code-for="verify-email" aria-hidden="true"></span><span id="verify-title">Verify your email</span></h1>
        <p id="verify-copy" class="auth-page__lede">Confirm that this address belongs to your corporation's account.</p>

        <p id="verify-status" class="auth-page__status" aria-live="polite"></p>

        <div class="auth-page__actions">
          <button id="verify-btn" class="ui-button ui-button--primary" type="button">Verify My Email</button>
          <a id="verify-login" href="/login.html" class="ui-button ui-button--secondary">Log In</a>
          <a id="verify-new-link" href="/check-email.html" class="ui-button ui-button--secondary" hidden>Ask For A New Link</a>
        </div>
      </section>
    </main>
  </body>
</html>
