<!doctype html>
<!-- AB#988 (ISP-281): the page a reset link opens. The token is in the fragment, which never reaches the server; the
     form posts it with the new password, so a mail scanner that fetches the link cannot spend it. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISP: Choose A New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="scripts/starfield.js"></script>
    <script type="module" src="scripts/reset-password-page.js"></script>
  </head>
  <body>
    <canvas id="starfield-canvas" aria-hidden="true"></canvas>
    <div class="app-bg" aria-hidden="true"></div>

    <main class="auth-page">
      <section class="ui-panel auth-page__card" aria-labelledby="reset-title">
        <p class="auth-page__overline">Earth Assembly Act 2147</p>
        <h1 id="reset-title" class="auth-page__title">Choose a new password</h1>
        <p id="reset-copy" class="auth-page__lede">
          At least 10 characters. Every device signed in to your account will be signed out, and we will email you to say
          the password changed.
        </p>

        <form id="reset-form" class="auth-page__form" novalidate>
          <div class="ui-field">
            <label class="ui-field__label" for="reset-password">New password</label>
            <input class="ui-input" id="reset-password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" />
          </div>

          <div class="ui-field">
            <label class="ui-field__label" for="reset-confirm">Type it again</label>
            <input class="ui-input" id="reset-confirm" name="confirm" type="password" autocomplete="new-password" required minlength="10" maxlength="128" />
          </div>

          <p id="reset-status" class="auth-page__status" aria-live="polite"></p>

          <div class="auth-page__actions">
            <button id="reset-btn" class="ui-button ui-button--primary" type="submit">Set New Password</button>
            <a id="reset-login" href="/login.html" class="ui-button ui-button--secondary">Log In</a>
            <a id="reset-new-link" href="/forgot-password.html" class="ui-button ui-button--secondary" hidden>Ask For A New Link</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
